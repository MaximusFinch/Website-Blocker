name: CodeQL

# Automatic security check of the Kotlin code.
# Runs on every push to main, on pull requests and once a week (new rules).
# Results: GitHub > Security > Code scanning.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload the results
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
          cache-disabled: true   # CodeQL has to see the full compilation

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # Debug build: needs no signing key, so no secrets are used here
      - name: Build
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --no-build-cache --rerun-tasks 2>&1 | tee build.log; then
            # Show the reason as annotations (visible without opening the log)
            grep -E "^e: |error:|What went wrong|FAILED|Exception|> " build.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
